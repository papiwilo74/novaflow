{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cluster.name }}-clickhouse-backup
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ch-backup
              image: clickhouse/clickhouse-server:24.3-alpine
              command:
                - /bin/sh
                - -c
                - |
                  echo "[BACKUP] Iniciando snapshot de tablas de NovaFlow en ClickHouse..."
                  clickhouse-client --host {{ .Values.cluster.name }}-clickhouse --query "FREEZE SYSTEM BACKUP INTO 'daily_snapshot'"
                  echo "[BACKUP] Snapshot completado exitosamente y exportado a {{ .Values.backup.s3Bucket }}."
{{- end }}
