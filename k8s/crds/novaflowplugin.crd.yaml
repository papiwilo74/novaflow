apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: novaflowplugins.novasec.io
spec:
  group: novasec.io
  names:
    kind: NovaFlowPlugin
    listKind: NovaFlowPluginList
    plural: novaflowplugins
    singular: novaflowplugin
    shortNames:
      - nfplugin
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - pluginName
                - category
                - severity
                - pythonCode
              properties:
                pluginName:
                  type: string
                  description: "Identificador único del plugin detector"
                category:
                  type: string
                  enum: ["PORT_SCAN", "SYN_FLOOD", "EXFILTRATION", "DNS_TUNNEL", "MALICIOUS_C2", "ANOMALY_ML", "CUSTOM"]
                  default: "CUSTOM"
                severity:
                  type: string
                  enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
                  default: "HIGH"
                description:
                  type: string
                enabled:
                  type: boolean
                  default: true
                pythonCode:
                  type: string
                  description: "Código fuente Python de la función o clase detectora"
            status:
              type: object
              properties:
                loaded:
                  type: boolean
                loadedAt:
                  type: string
                flowsEvaluated:
                  type: integer
                alertsFired:
                  type: integer
                lastError:
                  type: string
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Loaded
          type: boolean
          jsonPath: .status.loaded
