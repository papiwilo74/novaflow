apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: novaflowclusters.novasec.io
spec:
  group: novasec.io
  names:
    kind: NovaFlowCluster
    listKind: NovaFlowClusterList
    plural: novaflowclusters
    singular: novaflowcluster
    shortNames:
      - nfc
      - nfcluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.workers.replicas
          statusReplicasPath: .status.workersReady
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                  description: "Versión de la imagen de NovaFlow NDR (e.g. 1.0.0)"
                workers:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 64
                      default: 2
                      description: "Número de réplicas de workers UDP de ingesta"
                    udpPort:
                      type: integer
                      default: 2055
                      description: "Puerto UDP de escucha NetFlow / IPFIX"
                    batchSize:
                      type: integer
                      default: 5000
                    resources:
                      type: object
                      properties:
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                api:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      default: 2
                    enableDashboard:
                      type: boolean
                      default: true
                    serviceType:
                      type: string
                      enum: ["ClusterIP", "NodePort", "LoadBalancer"]
                      default: "ClusterIP"
                clickhouse:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      default: 1
                    retentionDays:
                      type: integer
                      default: 90
                    storageSize:
                      type: string
                      default: "100Gi"
                    storageClass:
                      type: string
                kafka:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    brokerUrl:
                      type: string
                      default: "novaflow-redpanda:9092"
                tenants:
                  type: array
                  items:
                    type: object
                    required:
                      - tenantId
                    properties:
                      tenantId:
                        type: string
                      name:
                        type: string
                      rateLimitRpm:
                        type: integer
                        default: 120
                      storageQuotaGb:
                        type: integer
                        default: 50
                tls:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    secretName:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Creating", "Running", "Degraded", "Updating"]
                observedGeneration:
                  type: integer
                workersReady:
                  type: integer
                apiReady:
                  type: integer
                clickhouseStatus:
                  type: string
                currentThroughputMbps:
                  type: number
                totalAlerts:
                  type: integer
                lastReconciled:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Workers
          type: integer
          jsonPath: .status.workersReady
        - name: API
          type: integer
          jsonPath: .status.apiReady
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
